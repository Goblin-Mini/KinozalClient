name: Android CI

on:
  push:
    branches: [ main, feature/magnet-playback, feature/performance, feature/screen-cache-background-refresh, feature/sidebar-login-status-stable-restore, fix/home-feed-js-extractor-diagnostics ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request' || (github.ref_name == 'feature/magnet-playback' || github.ref_name == 'feature/performance' || github.ref_name == 'feature/screen-cache-background-refresh' || github.ref_name == 'feature/sidebar-login-status-stable-restore' || github.ref_name == 'fix/home-feed-js-extractor-diagnostics')
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        if: github.event_name == 'pull_request' || github.ref_name == 'feature/magnet-playback' || github.ref_name == 'feature/performance' || github.ref_name == 'feature/screen-cache-background-refresh' || github.ref_name == 'feature/sidebar-login-status-stable-restore' || github.ref_name == 'fix/home-feed-js-extractor-diagnostics'
        uses: actions/upload-artifact@v4
        with:
          name: KinozalClient-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Decode release keystore
        if: github.event_name != 'pull_request' && (github.ref_name != 'feature/magnet-playback' && github.ref_name != 'feature/performance' && github.ref_name != 'feature/screen-cache-background-refresh' && github.ref_name != 'feature/sidebar-login-status-stable-restore' && github.ref_name != 'fix/home-feed-js-extractor-diagnostics')
        env:
          KEYSTORE_BASE64: ${{ secrets.KINOZAL_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KINOZAL_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kinozal-release.jks"
          test -s "$RUNNER_TEMP/kinozal-release.jks"

      - name: Build signed release APK
        if: github.event_name != 'pull_request' && github.ref_name != 'feature/magnet-playback' && github.ref_name != 'feature/performance' && github.ref_name != 'feature/screen-cache-background-refresh' && github.ref_name != 'feature/sidebar-login-status-stable-restore'
        env:
          KINOZAL_KEYSTORE_FILE: ${{ runner.temp }}/kinozal-release.jks
          KINOZAL_STORE_PASSWORD: ${{ secrets.KINOZAL_STORE_PASSWORD }}
          KINOZAL_KEY_ALIAS: ${{ secrets.KINOZAL_KEY_ALIAS }}
          KINOZAL_KEY_PASSWORD: ${{ secrets.KINOZAL_KEY_PASSWORD }}
        run: |
          test -n "$KINOZAL_STORE_PASSWORD"
          test -n "$KINOZAL_KEY_ALIAS"
          test -n "$KINOZAL_KEY_PASSWORD"
          gradle --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/KinozalClient.apk
          test -s dist/KinozalClient.apk
          VERSION_CODE=$(grep -E '^[[:space:]]*versionCode[[:space:]]*=' app/build.gradle.kts | awk -F= '{gsub(/[[:space:]]/, "", $2); print $2}')
          VERSION_NAME=$(grep -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | cut -d '"' -f2)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref_name != 'feature/magnet-playback' && github.ref_name != 'feature/performance' && github.ref_name != 'feature/screen-cache-background-refresh' && github.ref_name != 'feature/sidebar-login-status-stable-restore'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_CODE }}
          name: KinozalClient v${{ env.VERSION_NAME }}
          target_commitish: main
          files: dist/KinozalClient.apk
          overwrite_files: true
          make_latest: true
          generate_release_notes: true
