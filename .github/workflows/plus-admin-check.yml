name: Plus Admin validation

on:
  pull_request:
    paths:
      - "license-server/**"
      - "admin-panel/**"
      - ".github/workflows/plus-admin-check.yml"
  push:
    branches: [main, fix/home-feed-js-extractor-diagnostics, chore/license-worker-deploy-config]
    paths:
      - "license-server/**"
      - "admin-panel/**"
      - ".github/workflows/plus-admin-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript
        run: npm install --global typescript@5.8.3
      - name: Build Worker JavaScript
        run: tsc -p license-server/tsconfig.json
      - name: Validate admin page
        run: node admin-panel/validate.mjs
      # This artifact is the compiled entry point for Cloudflare Workers upload.
      - name: Upload dashboard-ready Worker script
        uses: actions/upload-artifact@v4
        with:
          name: kinozal-tv-license-worker
          path: license-server/dist/index.js
          if-no-files-found: error
      - name: Check Cloudflare deployment credentials
        id: cloudflare-secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/chore/license-worker-deploy-config'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy license Worker to Cloudflare
        if: steps.cloudflare-secrets.outputs.available == 'true'
        working-directory: license-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --no-save wrangler@4
          npx wrangler deploy --config wrangler.toml
      - name: Explain skipped Cloudflare deployment
        if: steps.cloudflare-secrets.outputs.available == 'false'
        run: echo "Validation succeeded. Cloudflare deployment skipped because repository deployment secrets are not configured; manual deployment remains available."
